# DoodBash defaults — the lowest-precedence configuration layer.
#
# Literal KEY=VALUE records only. Values are never expanded, substituted,
# quoted, or trimmed, and inline comments are not supported.
#
# DOOD_PROFILE and DOOD_HOST_OVERRIDE are selection inputs, not values, and
# never belong in this file. Machine-specific paths belong in a host or local
# layer, not here.

DOOD_COLOR=auto
DOOD_EDITOR=nvim
